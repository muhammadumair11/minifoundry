# MiniFoundry — dev infrastructure only.
#
# Runs Postgres + NATS with published ports so the frontend (bun dev) and
# Rust services (cargo run) can run natively on the host:
#
#   docker compose -f docker-compose.dev.yml up -d
#
# Host connection strings:
#   Set DATABASE_URL using the private role password from your .env.
#   NATS_URL=nats://localhost:4222
#
# NOTE: init.sql only runs on FIRST volume init — same as the main compose.

name: minifoundry-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: minifoundry
      POSTGRES_USER: postgres
      MF_AUTH_DB_PASSWORD: ${MF_AUTH_DB_PASSWORD:?Generate .env with node scripts/configure-env.mjs}
      MF_CATALOG_DB_PASSWORD: ${MF_CATALOG_DB_PASSWORD:?Generate .env with node scripts/configure-env.mjs}
      MF_ORCHESTRATION_DB_PASSWORD: ${MF_ORCHESTRATION_DB_PASSWORD:?Generate .env with node scripts/configure-env.mjs}
      MF_COMPUTE_DB_PASSWORD: ${MF_COMPUTE_DB_PASSWORD:?Generate .env with node scripts/configure-env.mjs}
      MF_ONTOLOGY_DB_PASSWORD: ${MF_ONTOLOGY_DB_PASSWORD:?Generate .env with node scripts/configure-env.mjs}
      MF_GOVERNANCE_DB_PASSWORD: ${MF_GOVERNANCE_DB_PASSWORD:?Generate .env with node scripts/configure-env.mjs}
      MF_SEED_DB_PASSWORD: ${MF_SEED_DB_PASSWORD:?Generate .env with node scripts/configure-env.mjs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env with node scripts/configure-env.mjs}
    ports:
      - "5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
      - ./deploy/postgres/role-passwords.sh:/docker-entrypoint-initdb.d/01-role-passwords.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d minifoundry"]
      interval: 5s
      timeout: 3s
      retries: 20

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - natsdata-dev:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8222/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata-dev:
  natsdata-dev:
