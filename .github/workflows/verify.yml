name: verify
on:
  push:
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:../db/ci.db
      MF_DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx prisma generate
      - run: bunx prisma validate
      - run: bunx prisma db push --skip-generate
      - run: bun run lint
      - run: bunx tsc --noEmit
      - run: bun test
      - run: bunx next build --webpack

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Compile-time sqlx macros (query!/query_as!) are not used in the
      # skeleton, but tests that do touch a DB use sqlx offline mode.
      SQLX_OFFLINE: "true"
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build   # vite build (generates route tree) then tsc --noEmit


