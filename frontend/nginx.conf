# MiniFoundry SPA — static serving + API proxy to the gateway.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # CSV/JSON uploads go through to the catalog service.
    client_max_body_size 64m;

    # gzip static assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # API → gateway (path preserved: /api/... → gateway /api/...)
    location /api/ {
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # SPA fallback — client-side routing owns every non-file path.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Immutable hashed build assets
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
